name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: write

# The allocator and tag push stay in one serialized critical section. A queued
# release is never allowed to cancel a release that may already have tagged.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, reserve, deploy, and publish
    runs-on: ubuntu-latest
    environment: Production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ultilog
          POSTGRES_PASSWORD: ultilog
          POSTGRES_DB: ultilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ultilog -d ultilog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CREW_ENCRYPTION_MASTER_KEY: ${{ secrets.CREW_ENCRYPTION_MASTER_KEY }}
      TEST_POSTGRES_URL: postgres://ultilog:ultilog@localhost:5432/ultilog_test
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags origin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run end-to-end deployment checks
        run: npm run test:e2e:ci

      - name: Validate Vercel production access
        shell: bash
        run: |
          set -euo pipefail
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: $variable" >&2
              exit 1
            fi
          done
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Reserve annotated release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --force --tags origin
            # The allocator supports GITHUB_OUTPUT when used directly, but this
            # step publishes outputs only after the corresponding tag is pushed.
            allocation="$(GITHUB_OUTPUT= node scripts/release-version.mjs)"
            version="$(sed -n 's/^version=//p' <<<"$allocation")"
            tag="$(sed -n 's/^tag=//p' <<<"$allocation")"

            git tag -a "$tag" -m "Release $version"
            if git push origin "refs/tags/$tag"; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The remote may have acquired this tag after our fetch. Keep that
            # reservation, remove only our unpushed local tag, and try the next
            # suffix after refreshing all remote tags.
            git tag --delete "$tag"
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Could not reserve a release tag after $max_attempts attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Generate release changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*' "${RELEASE_TARGET}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            gh release download "$previous_tag" --pattern releases.json --dir /tmp/previous-release || true
            if [ -f /tmp/previous-release/releases.json ]; then
              cp /tmp/previous-release/releases.json app/content/releases.json
            fi
          fi
          node scripts/generate-release-notes.mjs

      - name: Build the reserved version for Vercel
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          --build-env BUILD_VERSION="$BUILD_VERSION"
          --build-env NEXT_PUBLIC_BUILD_VERSION="$NEXT_PUBLIC_BUILD_VERSION"

      - name: Deploy the exact prebuilt output to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.version.outputs.tag }} to $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          --verify-tag
          --notes-file release-body.md
          app/content/releases.json
          --title "${{ steps.version.outputs.tag }}"

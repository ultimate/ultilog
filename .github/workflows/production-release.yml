name: Production Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer main revision supersedes an older run. In particular, an obsolete run
# must not remain alive long enough to deploy after its replacement.
concurrency:
  group: production-release
  cancel-in-progress: true

jobs:
  release:
    name: Verify, build, and deploy exact revision
    runs-on: ubuntu-latest
    environment: Production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ultilog
          POSTGRES_PASSWORD: ultilog
          POSTGRES_DB: ultilog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ultilog -d ultilog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CREW_ENCRYPTION_MASTER_KEY: ${{ secrets.CREW_ENCRYPTION_MASTER_KEY }}
      TEST_POSTGRES_URL: postgres://ultilog:ultilog@localhost:5432/ultilog_test
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out immutable triggering revision with complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run end-to-end deployment checks
        run: npm run test:e2e:ci

      - name: Validate Vercel production access
        shell: bash
        run: |
          set -euo pipefail
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: $variable" >&2
              exit 1
            fi
          done
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Capture normalized production build metadata
        id: build_metadata
        shell: bash
        run: |
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"

      - name: Build the tested revision for Vercel
        env:
          BUILD_COMMIT_SHA: ${{ steps.build_metadata.outputs.commit_sha }}
          BUILD_STARTED_AT: ${{ steps.build_metadata.outputs.started_at }}
        run: >-
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          --build-env BUILD_COMMIT_SHA="$BUILD_COMMIT_SHA"
          --build-env BUILD_STARTED_AT="$BUILD_STARTED_AT"

      - name: Deploy the exact prebuilt output to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Refusing to deploy obsolete revision $GITHUB_SHA; main is now $current_main" >&2
            exit 1
          fi
          deployment_url="$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $deployment_url" >> "$GITHUB_STEP_SUMMARY"
